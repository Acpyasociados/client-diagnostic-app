[build]
  command = "echo Build complete"
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/*"
  to = "/"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  included_files = ["templates/**"]

[functions."generate-report"]
  timeout = 26

[context.production.environment]
  SENDGRID_FROM_EMAIL = "noreply@acp-asociados.com"
  ADVISOR_EMAIL = "asesor.pac@gmail.com"
  SITE_URL = "https://acp-asociados.netlify.app"
  NODE_ENV = "production"
  PRICE_BASIC_CLP = "1000"
  PRICE_PREMIUM_CLP = "11000"