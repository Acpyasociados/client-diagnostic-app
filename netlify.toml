[build]
  command = "echo Build complete"
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/*"
  to = "/"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  included_files = ["templates/**"]

[functions.generate-report]
  timeout = 26

[context.production.environment]
