<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tiempo Real - ACP & Asociados</title>
  <style>
    :root {
      --primary: #1a3a5c;
      --primary-light: #2a5298;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --info: #17a2b8;
      --light: #f4f7fb;
      --border: #e0e7ef;
      --text: #2d3748;
      --text-muted: #718096;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--light);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOP BAR ───────────────────────────────────────── */
    .topbar {
      background: var(--primary);
      color: white;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .topbar-brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
    .topbar-status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }

    /* ── MAIN ──────────────────────────────────────────── */
    .main { padding: 28px; max-width: 1200px; margin: 0 auto; }

    /* ── STATS GRID ────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      border-top: 4px solid var(--primary);
    }

    .stat-card.revenue { border-top-color: var(--success); }
    .stat-card.leads { border-top-color: var(--info); }
    .stat-card.quest { border-top-color: var(--warning); }
    .stat-card.reports { border-top-color: #6f42c1; }

    .stat-value {
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-card.revenue .stat-value { color: var(--success); }
    .stat-card.leads .stat-value { color: var(--info); }
    .stat-card.quest .stat-value { color: var(--warning); }
    .stat-card.reports .stat-value { color: #6f42c1; }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: .6px;
      margin-bottom: 4px;
    }

    .stat-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* ── LEADS TABLE ───────────────────────────────────── */
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
      color: var(--primary);
      background: #f8fafc;
    }

    .card-header .meta {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: auto;
    }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #f8fafc; }
    th {
      padding: 12px 14px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--text-muted);
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 13px 14px;
      border-bottom: 1px solid #f0f4f8;
      font-size: 13.5px;
      vertical-align: middle;
    }
    tbody tr:hover { background: #f8fafc; }
    tbody tr:last-child td { border-bottom: none; }

    /* ── BADGES ────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-warning { background: #fef9c3; color: #854d0e; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .badge-muted { background: #f1f5f9; color: #64748b; }

    /* ── LOADING & EMPTY STATES ─────────────────────── */
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty { text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }
    .empty-text { font-size: 14px; color: var(--text-muted); }

    /* ── CONTROL BAR ────────────────────────────────── */
    .control-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-light); }

    .btn-secondary { background: #f1f5f9; color: var(--text); }
    .btn-secondary:hover { background: #e2e8f0; }

    .period-select {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .period-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 58, 92, .1);
    }

    /* ── LAST UPDATE ─────────────────────────────── */
    .last-update {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .update-indicator {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse .8s infinite;
    }

    /* ── RESPONSIVE ────────────────────────────────── */
    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
      .topbar { padding: 0 16px; }
      .main { padding: 16px; }
      table { font-size: 12px; }
      td, th { padding: 10px 8px; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-brand">
      📊 Dashboard Tiempo Real
    </div>
    <div class="topbar-status">
      <span class="status-dot"></span>
      En vivo
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">

    <!-- CONTROL BAR -->
    <div class="control-bar">
      <label for="period">Período:</label>
      <select id="period" class="period-select">
        <option value="today">Hoy (últimas 24h)</option>
        <option value="thisMonth">Este mes (30 días)</option>
      </select>
      <button class="btn btn-secondary" onclick="loadData()">🔄 Actualizar ahora</button>
      <div class="last-update" style="margin-left: auto;">
        <span class="update-indicator"></span>
        <span id="lastUpdate">Cargando...</span>
      </div>
    </div>

    <!-- STATS CARDS -->
    <div class="stats-grid">
      <div class="stat-card revenue">
        <div class="stat-label">Ingresos Hoy</div>
        <div class="stat-value" id="totalRevenue">$0</div>
        <div class="stat-sub" id="revenueCount">0 pagos aprobados</div>
      </div>

      <div class="stat-card leads">
        <div class="stat-label">Pagos Aprobados</div>
        <div class="stat-value" id="totalLeads">0</div>
        <div class="stat-sub" id="leadsSubtitle">En período actual</div>
      </div>

      <div class="stat-card quest">
        <div class="stat-label">Cuestionarios</div>
        <div class="stat-value" id="questCompleted">0</div>
        <div class="stat-sub" id="questRate">0% completado</div>
      </div>

      <div class="stat-card reports">
        <div class="stat-label">Reportes Generados</div>
        <div class="stat-value" id="reportsGenerated">0</div>
        <div class="stat-sub" id="reportRate">0% generado</div>
      </div>
    </div>

    <!-- LEADS TABLE -->
    <div class="card">
      <div class="card-header">
        Leads Pagados Recientemente
        <div class="meta" id="tableCount">Cargando...</div>
      </div>
      <div style="overflow-x: auto;">
        <table id="leadsTable">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Email</th>
              <th>Empresa</th>
              <th>Plan</th>
              <th>Monto</th>
              <th>Cuestionario</th>
              <th>Reporte</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="leadsBody">
            <tr>
              <td colspan="8" class="loading">Cargando leads...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    const API_URL = '/.netlify/functions/get-leads-dashboard';
    let autoRefreshInterval;

    async function loadData() {
      const period = document.getElementById('period').value;

      try {
        const response = await fetch(`${API_URL}?period=${period}&limit=50`);
        if (!response.ok) throw new Error('Error fetching data');

        const data = await response.json();

        if (data.success) {
          updateStats(data.stats);
          updateTable(data.leads);
          updateTimestamp();
        }
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('lastUpdate').textContent = 'Error al cargar datos';
      }
    }

    function updateStats(stats) {
      // Ingresos
      const revenueFormatted = new Intl.NumberFormat('es-CL', {
        style: 'currency',
        currency: 'CLP',
        maximumFractionDigits: 0
      }).format(stats.total_revenue_clp);

      document.getElementById('totalRevenue').textContent = revenueFormatted;
      document.getElementById('revenueCount').textContent = `${stats.total_leads_paid} pagos aprobados`;

      // Pagos
      document.getElementById('totalLeads').textContent = stats.total_leads_paid;
      document.getElementById('leadsSubtitle').textContent = 'En período actual';

      // Cuestionarios
      document.getElementById('questCompleted').textContent = stats.questionnaire_completed;
      const questPercent = Math.round(stats.questionnaire_completion_rate * 100);
      document.getElementById('questRate').textContent = `${questPercent}% completado`;

      // Reportes
      document.getElementById('reportsGenerated').textContent = stats.report_generated;
      const reportPercent = Math.round(stats.report_generation_rate * 100);
      document.getElementById('reportRate').textContent = `${reportPercent}% generado`;
    }

    function updateTable(leads) {
      const tbody = document.getElementById('leadsBody');

      if (leads.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="empty">
              <div class="empty-icon">📭</div>
              <div class="empty-text">No hay leads pagados en este período</div>
            </td>
          </tr>
        `;
        document.getElementById('tableCount').textContent = '0 leads';
        return;
      }

      document.getElementById('tableCount').textContent = `${leads.length} leads`;

      tbody.innerHTML = leads.map(lead => {
        const questBadge = lead.questionnaire_completed
          ? '<span class="badge badge-success">✓ Completado</span>'
          : '<span class="badge badge-muted">⏳ Pendiente</span>';

        const reportBadge = lead.report_generated
          ? '<span class="badge badge-success">✓ Listo</span>'
          : '<span class="badge badge-muted">⏳ Generando</span>';

        const createdDate = new Date(lead.created_at);
        const timeStr = createdDate.toLocaleTimeString('es-CL', {
          hour: '2-digit',
          minute: '2-digit'
        });

        return `
          <tr>
            <td><strong>${escapeHtml(lead.name)}</strong></td>
            <td style="font-size: 12px;">${escapeHtml(lead.email)}</td>
            <td>${escapeHtml(lead.company)}</td>
            <td>
              <span class="badge badge-info">${lead.plan === 'premium' ? 'Premium' : 'Básico'}</span>
            </td>
            <td><strong>$${lead.amount.toLocaleString('es-CL')}</strong></td>
            <td>${questBadge}</td>
            <td>${reportBadge}</td>
            <td style="font-size: 12px; color: var(--text-muted);">${timeStr}</td>
          </tr>
        `;
      }).join('');
    }

    function updateTimestamp() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('es-CL', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('lastUpdate').textContent = `Actualizado a las ${timeStr}`;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    document.getElementById('period').addEventListener('change', loadData);

    // Auto-refresh cada 30 segundos
    function startAutoRefresh() {
      loadData(); // Cargar inmediatamente
      autoRefreshInterval = setInterval(loadData, 30000); // Luego cada 30s
    }

    // Iniciar cuando la página carga
    document.addEventListener('DOMContentLoaded', startAutoRefresh);

    // Pausar auto-refresh cuando se cierra la pestaña
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(autoRefreshInterval);
      } else {
        startAutoRefresh();
      }
    });
  </script>

</body>
</html>
