<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplos de Reportes Diagnósticos — 10 Sectores</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', Arial, sans-serif;
      background: #ECF0F3;
      color: #2C3E50;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, #1B3B5C 0%, #16A085 100%);
      color: white;
      padding: 40px;
      border-radius: 6px;
      margin-bottom: 40px;
      text-align: center;
    }
    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      margin-bottom: 10px;
    }
    .header p {
      font-size: 16px;
      opacity: 0.9;
    }
    .sectors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .sector-card {
      background: white;
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      border-left: 4px solid #1B3B5C;
    }
    .sector-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .sector-card.selected {
      background: linear-gradient(135deg, #f0fff0 0%, #e8f8f5 100%);
      border-left-color: #16A085;
    }
    .sector-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .sector-name {
      font-size: 18px;
      font-weight: 600;
      color: #1B3B5C;
      margin-bottom: 10px;
    }
    .sector-metrics {
      font-size: 13px;
      color: #666;
      line-height: 1.8;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .metric-label {
      font-weight: 600;
    }
    .metric-value {
      color: #16A085;
      font-weight: 700;
    }
    .preview-section {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-bottom: 40px;
    }
    .preview-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: #1B3B5C;
      margin-bottom: 10px;
      border-bottom: 3px solid #16A085;
      padding-bottom: 10px;
    }
    .preview-subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .preview-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    .preview-card {
      background: #ECF0F3;
      padding: 20px;
      border-radius: 6px;
      border-top: 3px solid #16A085;
    }
    .preview-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: #16A085;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .preview-card .value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 700;
      color: #16A085;
      margin-bottom: 8px;
    }
    .preview-card .comparison {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
    .benchmark-bar {
      background: #fff;
      border-radius: 3px;
      height: 20px;
      margin: 10px 0;
      overflow: hidden;
    }
    .benchmark-fill {
      height: 100%;
      background: linear-gradient(90deg, #16A085 0%, #1B9370 100%);
      transition: width 0.3s;
    }
    .download-btn {
      display: inline-block;
      background: linear-gradient(135deg, #16A085 0%, #0F8B6B 100%);
      color: white;
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      margin-right: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(22, 160, 133, 0.3);
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #ECF0F3;
    }
    .info-box {
      background: #f0f6ff;
      border-left: 4px solid #3498DB;
      padding: 20px;
      border-radius: 6px;
      margin-top: 30px;
      font-size: 13px;
      line-height: 1.7;
    }
    .info-box strong {
      color: #3498DB;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📊 Ejemplos de Reportes Diagnósticos</h1>
    <p>Visualiza cómo se ve el nuevo template mejorado para cada uno de los 10 sectores</p>
  </div>

  <div class="sectors-grid" id="sectorsGrid"></div>

  <div class="preview-section" id="previewSection">
    <div class="preview-title">Selecciona un sector para ver el ejemplo</div>
    <p style="color: #666; font-size: 14px;">Haz clic en cualquier sector de arriba para ver una vista previa de cómo se vería su reporte diagnóstico.</p>
  </div>

</div>

<script>
const SECTORS = {
  servicios_profesionales: {
    icon: '⚖️',
    name: 'Servicios Profesionales',
    company: 'Silva & Asociados - Asesoría Legal',
    client: 'Jorge Silva Morales',
    monthly_sales: '$8.500.000',
    margin: 42,
    clients: 28,
    benchmark_margin: 35,
    benchmark_revenue: '$10.000.000',
    benchmark_clients: 20,
    plan: 'PREMIUM'
  },
  comercio_ecommerce: {
    icon: '🛒',
    name: 'Comercio / E-commerce',
    company: 'TiendaMax - E-commerce',
    client: 'María García López',
    monthly_sales: '$12.000.000',
    margin: 24,
    clients: 1250,
    benchmark_margin: 25,
    benchmark_revenue: '$8.000.000',
    benchmark_clients: 150,
    plan: 'PREMIUM'
  },
  servicios_terreno: {
    icon: '🔧',
    name: 'Servicios de Terreno',
    company: 'TecnoServicios Field',
    client: 'Roberto Pérez Delgado',
    monthly_sales: '$5.200.000',
    margin: 28,
    clients: 45,
    benchmark_margin: 26,
    benchmark_revenue: '$6.500.000',
    benchmark_clients: 38,
    plan: 'BÁSICO'
  },
  construccion: {
    icon: '🏗️',
    name: 'Construcción',
    company: 'Constructora Regional',
    client: 'Felipe Ramírez Contreras',
    monthly_sales: '$18.500.000',
    margin: 22,
    clients: 12,
    benchmark_margin: 20,
    benchmark_revenue: '$15.000.000',
    benchmark_clients: 8,
    plan: 'PREMIUM'
  },
  gastronomia: {
    icon: '🍽️',
    name: 'Gastronomía',
    company: 'Grupo Gastronómico Valle Central',
    client: 'Alejandra Mendez Soto',
    monthly_sales: '$6.800.000',
    margin: 29,
    clients: 180,
    benchmark_margin: 30,
    benchmark_revenue: '$6.000.000',
    benchmark_clients: 200,
    plan: 'BÁSICO'
  },
  salud_belleza: {
    icon: '💅',
    name: 'Salud & Belleza',
    company: 'Centros Wellness Pro',
    client: 'Catalina Valencia Moreno',
    monthly_sales: '$4.500.000',
    margin: 35,
    clients: 420,
    benchmark_margin: 32,
    benchmark_revenue: '$5.500.000',
    benchmark_clients: 350,
    plan: 'PREMIUM'
  },
  tecnologia: {
    icon: '💻',
    name: 'Tecnología',
    company: 'TechSolutions Inc.',
    client: 'Juan Pérez Díaz',
    monthly_sales: '$15.000.000',
    margin: 38,
    clients: 12,
    benchmark_margin: 32,
    benchmark_revenue: '$12.000.000',
    benchmark_clients: 8,
    plan: 'PREMIUM'
  },
  educacion: {
    icon: '📚',
    name: 'Educación',
    company: 'Academia Integral Learning',
    client: 'Patricio Morales Gómez',
    monthly_sales: '$7.200.000',
    margin: 31,
    clients: 520,
    benchmark_margin: 28,
    benchmark_revenue: '$8.000.000',
    benchmark_clients: 480,
    plan: 'BÁSICO'
  },
  manufactura: {
    icon: '⚙️',
    name: 'Manufactura',
    company: 'Industrias Metal Precisión',
    client: 'Carlos Rodríguez Hernández',
    monthly_sales: '$22.000.000',
    margin: 18,
    clients: 8,
    benchmark_margin: 17,
    benchmark_revenue: '$20.000.000',
    benchmark_clients: 6,
    plan: 'PREMIUM'
  },
  otro: {
    icon: '📊',
    name: 'Otros Sectores',
    company: 'Negocios Diversos SPA',
    client: 'Patricia Díaz López',
    monthly_sales: '$8.000.000',
    margin: 28,
    clients: 35,
    benchmark_margin: 27,
    benchmark_revenue: '$7.500.000',
    benchmark_clients: 30,
    plan: 'BÁSICO'
  }
};

let currentSector = null;

function renderSectors() {
  const grid = document.getElementById('sectorsGrid');
  Object.entries(SECTORS).forEach(([key, sector]) => {
    const marginDiff = sector.margin - sector.benchmark_margin;
    const marginClass = marginDiff >= 0 ? 'positive' : 'negative';
    const marginText = marginDiff >= 0 ? `+${marginDiff}pp` : `${marginDiff}pp`;

    const card = document.createElement('div');
    card.className = 'sector-card';
    card.innerHTML = `
      <div class="sector-icon">${sector.icon}</div>
      <div class="sector-name">${sector.name}</div>
      <div class="sector-metrics">
        <div class="metric-row">
          <span class="metric-label">Ventas:</span>
          <span class="metric-value">${sector.monthly_sales}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Margen:</span>
          <span class="metric-value">${sector.margin}%</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">vs Sector:</span>
          <span class="metric-value">${marginText}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Clientes:</span>
          <span class="metric-value">${sector.clients}</span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Plan:</span>
          <span class="metric-value">${sector.plan}</span>
        </div>
      </div>
    `;
    card.addEventListener('click', () => showPreview(key, sector));
    grid.appendChild(card);
  });
}

function showPreview(key, sector) {
  currentSector = key;

  // Update selected card
  document.querySelectorAll('.sector-card').forEach(card => card.classList.remove('selected'));
  event.target.closest('.sector-card').classList.add('selected');

  const marginDiff = sector.margin - sector.benchmark_margin;
  const marginStatus = marginDiff >= 0 ? '✓ Arriba del promedio' : '⚠ Bajo el promedio';

  const marginFill = Math.round((sector.margin / sector.benchmark_margin) * 100);
  const revenueFill = 150; // simulated
  const clientsFill = sector.clients > sector.benchmark_clients ? 160 : 100;

  const html = `
    <div class="preview-title">Ejemplo: ${sector.icon} ${sector.name}</div>
    <div class="preview-subtitle">Reporte para: <strong>${sector.company}</strong></div>

    <div class="preview-content">
      <div class="preview-card">
        <h3>📊 Ventas Mensuales</h3>
        <div class="value">${sector.monthly_sales}</div>
        <div class="comparison">
          <strong>Promedio sector:</strong> ${sector.benchmark_revenue}<br>
          <strong>Posición:</strong> Por encima del promedio
        </div>
      </div>

      <div class="preview-card">
        <h3>💹 Margen de Ganancia</h3>
        <div class="value">${sector.margin}%</div>
        <div class="comparison">
          <strong>Promedio sector:</strong> ${sector.benchmark_margin}%<br>
          <strong>Diferencia:</strong> ${marginStatus}
        </div>
        <div class="benchmark-bar">
          <div class="benchmark-fill" style="width: ${marginFill}%;"></div>
        </div>
      </div>

      <div class="preview-card">
        <h3>👥 Cartera de Clientes</h3>
        <div class="value">${sector.clients}</div>
        <div class="comparison">
          <strong>Promedio sector:</strong> ${sector.benchmark_clients} clientes<br>
          <strong>Concentración:</strong> ${sector.clients < 20 ? 'Alta' : sector.clients < 100 ? 'Moderada' : 'Baja'}
        </div>
      </div>

      <div class="preview-card">
        <h3>🎯 Plan</h3>
        <div class="value">${sector.plan}</div>
        <div class="comparison">
          Incluye diagnóstico completo de 6 páginas con análisis comparativo detallado.
        </div>
      </div>
    </div>

    <div class="info-box">
      <strong>📄 Contenido del Reporte de 6 Páginas:</strong>
      <ul style="margin-left: 20px; margin-top: 10px;">
        <li><strong>Página 1:</strong> Portada con logo ACP, empresa, plan y datos de contacto</li>
        <li><strong>Página 2:</strong> Resumen Ejecutivo con 3 métricas principales</li>
        <li><strong>Página 3:</strong> Análisis Comparativo por Sector (NEW) con benchmarks visuales</li>
        <li><strong>Página 4:</strong> Hallazgos Clave con 3 recomendaciones priorizadas (NEW)</li>
        <li><strong>Página 5:</strong> 3 Oportunidades de Mejora con detalles de impacto y KPIs</li>
        <li><strong>Página 6:</strong> Plan de Acción con timeline 30-60-90 días</li>
      </ul>
    </div>

    <div class="action-buttons">
      <button class="download-btn" onclick="downloadSampleReport('${key}')">
        📥 Ver Reporte Completo
      </button>
      <button class="download-btn" onclick="printPreview()" style="background: linear-gradient(135deg, #3498DB 0%, #2980B9 100%);">
        🖨️ Imprimir Vista Previa
      </button>
    </div>
  `;

  document.getElementById('previewSection').innerHTML = html;
}

function downloadSampleReport(sectorKey) {
  alert(`✅ El reporte completo para ${SECTORS[sectorKey].name} estaría listo para descargar en producción.\n\nEste ejemplo es una vista previa del contenido y estructura del reporte.`);
}

function printPreview() {
  window.print();
}

// Render on load
renderSectors();

// Mostrar primer sector por defecto
showPreview('tecnologia', SECTORS.tecnologia);
document.querySelectorAll('.sector-card')[6].classList.add('selected'); // Tecnología es el 7º elemento (índice 6)
</script>

</body>
</html>
